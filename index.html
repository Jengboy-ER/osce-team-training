<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住院病人 OSCE 四人團隊訓練中心</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#172b3b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#123a57;color:white;padding:22px 16px}main{max-width:1000px;margin:auto;padding:18px}h1{font-size:1.5rem;margin:0 0 8px}h2{font-size:1.2rem}p{line-height:1.65}.sub{color:#d9e9f4}.panel{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}.scenario{background:white;text-align:left;border:1px solid #d6e0ea;border-radius:12px;padding:14px;cursor:pointer;color:inherit}.scenario:hover,.scenario.active{border-color:#1873a4;background:#eaf5fc}.scenario strong{display:block;margin-bottom:6px}.muted{color:#576b7a;font-size:.9rem}button{font:inherit}select,.btn{border:1px solid #b6c8d5;border-radius:9px;background:white;padding:9px 12px;color:#18384c;cursor:pointer}.btn.primary{background:#12658f;color:white;border-color:#12658f}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.scene{border-left:4px solid #287caa;padding:12px 14px;margin:14px 0;background:#f7fbfe;border-radius:8px}.line{padding:9px 0;border-bottom:1px solid #e2e9ef;line-height:1.65}.who{font-weight:750;color:#12658f}.tag{font-size:.8rem;border-radius:20px;padding:3px 9px;background:#e5eef5;color:#34556c}.danger{color:#9e2929}.hidden{display:none}footer{padding:20px;color:#596d7b;text-align:center;font-size:.85rem}@media print{header,.toolbar,#catalog,.btn{display:none!important}main{max-width:none}.panel{border:0}body{background:white}} </style></head><body><header><main style="padding:0"><h1>住院病人 OSCE 四人團隊訓練中心</h1><div class="sub">12 種病房急症 · 六幕完整演練 · NP1 / NP2 / RN1 / RN2 · Closed-loop · SBAR</div></main></header><main><div class="panel" id="catalog"><h2>選擇病房急症劇本</h2><div class="grid" id="cards"></div></div><section class="panel" id="viewer"><h2 id="caseTitle"></h2><p id="intro"></p><div class="toolbar"><label>閱讀角色 <select id="role"><option value="ALL">全部角色</option><option value="NP1">NP1 Team Leader</option><option value="NP2">NP2 評估</option><option value="RN1">RN1 處置</option><option value="RN2">RN2 通報</option></select></label><button class="btn" id="copy">複製目前劇本</button><button class="btn" id="share">分享此題連結</button><button class="btn" onclick="window.print()">列印 / 存 PDF</button></div><div id="scenes"></div></section><p class="muted">教學模擬，非個別病人醫囑。用藥、處置、通報層級與專科護理師授權範圍以院內制度為準。情境中的檢驗結果及病情變化均為虛構。</p></main><footer>OSCE Team Simulation · Traditional Chinese · Offline-ready</footer><script>
const cases=[
['急性呼吸衰竭','COPD、肺炎住院病人，突然喘且意識變差','72歲男性，COPD及肺炎住院第2天；BP 146/84、HR 126、RR 36、SpO₂ 78%（室內空氣）、GCS 14；原有22G IV。','急性低血氧與高碳酸血症風險','血氣 pH 7.24、PaCO₂ 78、HCO₃ 33；病人呼吸費力，意識逐漸變差。','適當氧療、支氣管擴張治療及呼吸支持評估','給氧後SpO₂ 90%；30分鐘後病人嗜睡，pH 7.20、PaCO₂ 86。','NIV失敗警訊，立即準備高階氣道處置','醫師與呼吸治療團隊到場，準備插管；插管後以波形ETCO₂確認，監測通氣與循環。'],
['敗血性休克','泌尿道感染住院病人突發低血壓','76歲女性，UTI住院第3天；BP 78/42、HR 132、RR 30、SpO₂ 91%、BT 39.4°C、GCS 12；CKD stage 3。','疑似感染相關休克與器官灌流不足','末梢冰冷、CRT 5秒；血糖186；Lactate 5.1 mmol/L，尿量15mL/2小時。','採檢、及早抗生素與動態輸液復甦','晶體液分次給予後BP仍82/46，肺音暫無濕囉音，灌流不佳。','持續休克，升壓劑與ICU評估','值班醫師到場，依院內流程準備Norepinephrine並評估ICU；追蹤MAP、尿量、Lactate與液體反應。'],
['急性冠心症 ACS','住院病人胸痛冒冷汗合併低血壓','65歲男性，肺炎住院第4天；突發胸部壓迫痛放射左臂，BP 86/54、HR 124、RR 28、SpO₂ 88%。','疑似ACS與血流動力不穩','12導程EKG示II、III、aVF ST上升；血糖152；仍胸痛。','立即通報疑似STEMI，避免延誤再灌流','重測BP 82/50，胸痛持續；考慮右心室梗塞，避免在低血壓下常規使用硝酸鹽。','心導管團隊與休克處置','值班醫師與心臟科接手，安排緊急再灌流評估與監測。'],
['不穩定心律不整','心悸、HR 180且血壓下降','70歲女性，心衰竭住院第2天；突然心悸、頭暈，BP 70/40、HR 182、SpO₂ 93%，意識混亂。','有脈搏但血流動力不穩的心搏過速','Monitor示規則窄QRS心搏過速約180/min，仍有脈搏。','準備同步電復律與鎮靜評估','血壓持續下降，病人更嗜睡；醫師已到床邊。','立即依ACLS執行同步電復律','電復律後心律轉為竇律，HR 96、BP 108/66；持續監測並找原因。'],
['急性腦中風','突發口齒不清與單側無力','74歲男性，肺炎住院第5天；14:10最後確認正常，14:25發現右側無力與語言不清；BP 172/92、HR 88、SpO₂ 96%。','疑似急性腦中風，確認Last Known Well','血糖118；右上肢2/5、右下肢3/5，右側顏面無力。','啟動Stroke Code，緊急腦部影像','無創傷；目前未得知是否使用抗凝血藥，需查核用藥及禁忌。','腦部CT與再灌流適應症評估','CT未見出血；由中風團隊評估血管影像與血栓溶解／取栓資格。'],
['過敏性休克','IV抗生素後喘鳴、皮疹、低血壓','56歲女性，蜂窩性組織炎住院第2天；剛開始新抗生素輸注後2分鐘，BP 72/40、HR 140、SpO₂ 86%，全身蕁麻疹、喘鳴。','疑似Anaphylaxis，呼吸與循環同時受威脅','雙側喘鳴、嘴唇腫脹，聲音沙啞，輸注仍在進行。','立即停止可疑藥物、IM Epinephrine與氣道準備','依院內流程成人Epinephrine 0.3–0.5 mg IM（1 mg/mL，外側大腿）；持續低血壓需重評與補液。','重複評估、必要時重複Epinephrine及進階氣道','喘鳴改善，BP 102/64、SpO₂ 96%；持續觀察雙相反應與轉入監護需求。'],
['急性肺水腫','心衰竭病人突發嚴重喘','79歲男性，心衰竭住院第2天；BP 188/104、HR 124、RR 36、SpO₂ 82%，端坐呼吸。','疑似急性心因性肺水腫','雙肺廣泛Crackles、頸靜脈怒張、粉紅色泡沫痰；EKG待評估。','呼吸支持、血壓導向治療與誘因評估','在適當氧療及NIV評估後SpO₂升至93%，BP 166/92；醫師評估血管擴張劑與利尿劑。','監測NIV反應及循環','呼吸速率降至26，SpO₂ 95%；持續監測血壓、尿量、電解質及呼吸疲乏。'],
['嚴重低血糖','糖尿病住院病人突然叫不醒','68歲男性，肺炎住院第3天；BP 92/58、HR 118、RR 24、SpO₂ 94%、GCS E2V2M4，冒冷汗。','意識改變，先處理氣道並測血糖','床邊血糖32 mg/dL；IV通暢，病人無法安全吞嚥。','立即IV葡萄糖治療，禁止經口餵糖','依醫囑／授權流程給予Dextrose 25g IV，確認通路避免外滲；15分鐘後血糖126。','重新評估意識與低血糖復發','GCS E4V5M6、BP112/68；檢視胰島素、進食、腎功能並規劃持續血糖監測。'],
['上消化道出血','住院病人突發大量吐血','63歲男性，肝硬化住院第2天；突然大量鮮血嘔吐，BP 75/45、HR 142、RR 28、SpO₂ 91%，意識焦躁。','大量出血與吸入風險','嘔血約500mL，皮膚冰冷，Hb 6.8 g/dL，INR 1.7；血型交叉配對進行中。','氣道保護、輸血準備與緊急內視鏡會診','輸血流程啟動，BP仍偏低；依醫師評估靜脈曲張出血相關治療。','持續出血與ICU評估','醫師到場，胃腸科安排緊急內視鏡；追蹤血壓、Hb、凝血、尿量與輸血反應。'],
['嚴重高血鉀','CKD病人心搏過緩、QRS變寬','71歲男性，CKD住院第4天；BP 86/48、HR 38、RR 22、SpO₂ 95%，頭暈無力。','疑似危及生命的高血鉀心電圖變化','EKG顯示QRS變寬、尖峰T波；K⁺ 7.2 mmol/L，血糖142。','立即心肌膜穩定與降鉀治療','依醫囑給IV Calcium並持續監測EKG；準備Insulin/Glucose及其他移鉀措施。','追蹤血鉀與根本移除','HR升至72，QRS變窄；安排重測K⁺、血糖與緊急透析評估。'],
['術後肺栓塞','骨科術後突然胸痛與低血氧','67歲女性，髖關節手術後第3天；突然喘、胸痛，BP 82/50、HR 136、RR 32、SpO₂ 80%。','疑似高風險PE與阻塞性休克','右下肢腫脹，雙肺無明顯濕囉音；床邊心超疑右心室擴大。','立即高風險PE通報、循環與氧合支持','仍低血壓，醫師評估CTPA可行性、床邊超音波及出血風險。','高風險PE治療與轉ICU','由醫師團隊評估抗凝、再灌流策略及術後出血風險，安排ICU。'],
['院內心跳停止 IHCA','住院病人突然無反應、無正常呼吸','59歲男性，肺炎住院第5天；突然倒下，無反應、無正常呼吸，10秒內未摸到明確脈搏。','確認心跳停止，立即CPR與Code Blue','Monitor示VF；胸外按壓進行中，除顫器已到床邊。','持續高品質CPR與儘早除顫','依ACLS流程除顫後立即恢復按壓；每2分鐘節律與施救者輪替。','ROSC後照護','ROSC後BP104/62、SpO₂ 96%；評估氣道、12導程EKG、可逆原因及ICU。']
];
const roleLabels={NP1:'NP1｜Team Leader',NP2:'NP2｜ABCDE評估',RN1:'RN1｜處置執行',RN2:'RN2｜通報紀錄'};
function line(r,t){return {r,t}};
function script(c){let [title,brief,intro,concern,assessment,action,change,escalation,outcome]=c;return [
{title:'第一幕｜病況突變與啟動',lines:[line('RN1',`Team Leader，${brief}！目前病人狀況：${intro}，請立即到床邊。`),line('NP1',`我是Team Leader。病人急性惡化，目前優先問題是${concern}。依院內規定啟動緊急應變。所有人收到指令請覆誦，完成後回報。`),line('NP1','NP2，立即評估ABCDE，特別確認呼吸道、呼吸、灌流、意識及危險徵象。'),line('NP2','收到，立即執行ABCDE，異常立即回報。'),line('NP1','RN1，接心電與血氧監測、量血壓、確認IV通路，依氧合狀態準備氧氣與急救設備；立即測床邊血糖。'),line('RN1','收到，監測生命徵象、確認IV、測血糖並準備必要設備。'),line('NP1','RN2，立即依院內流程緊急通報並通知值班醫師，準備急救車、紀錄病況發生時間及每項處置。'),line('RN2','收到，啟動緊急通報、通知值班醫師、準備急救車並紀錄。')]},
{title:'第二幕｜ABCDE與關鍵檢查',lines:[line('NP2',`Team Leader，ABCDE初步評估：${assessment}。持續評估呼吸道保護能力與循環灌流。`),line('NP1',`收到。優先處理${concern}，並同步尋找可逆原因。`),line('RN1','Team Leader，監測已接上，IV通路已確認，床邊血糖已測量；必要檢驗與設備已準備。'),line('NP1','收到。請依院內授權流程及醫囑安排相關檢驗，危急結果立即口頭回報。'),line('RN2','Team Leader，值班醫師已接獲通知；急救車已到床邊，持續紀錄生命徵象。'),line('NP1','收到。若醫師尚未到場，請持續追蹤並依病況升級通報。')]},
{title:'第三幕｜緊急處置',lines:[line('NP1',`目前判斷：${concern}。治療重點：${action}。RN1，依醫囑／授權緊急流程準備並執行對應處置，執行前核對藥物、劑量、途徑與禁忌。`),line('RN1',`收到，依醫囑／授權流程執行：${action}；核對後回報完成時間及病人反應。`),line('NP1','NP2，持續評估ABCDE與處置反應；如意識、呼吸或循環惡化，立即通知我。'),line('NP2','收到，持續評估並立即回報變化。'),line('NP1','RN2，更新值班醫師目前評估及已執行處置，確認醫師到場及後續支援。'),line('RN2','收到，更新醫師並確認支援與紀錄。')]},
{title:'第四幕｜病況變化與升級',lines:[line('RN1',`Team Leader，治療後病況變化：${change}`),line('NP2',`Team Leader，重新評估顯示：${escalation}。`),line('NP1',`收到。現在優先處理：${escalation}。RN1，準備相應急救設備及治療；NP2持續監測；RN2立即向醫師更新病情並協調進階支援。`),line('RN1','收到，準備設備與治療，完成後回報。'),line('NP2','收到，持續重新評估ABCDE。'),line('RN2','收到，已更新醫師，依病況協調緊急支援。')]},
{title:'第五幕｜處置後重新評估',lines:[line('NP2',`Team Leader，後續病況：${outcome}`),line('NP1','收到。請繼續監測生命徵象、意識、呼吸與尿量（若適用），並確認處置效果及併發症。'),line('RN1','收到，持續監測，確認藥物、輸液及通路安全，異常立即回報。'),line('RN2','收到，完成時間軸、醫囑執行及轉入／會診紀錄。')]},
{title:'第六幕｜SBAR醫師交班',lines:[line('NP1',`S（Situation）：醫師您好，病房病人出現急性惡化，主要問題為${concern}。`),line('NP1',`B（Background）：${intro}`),line('NP1',`A（Assessment）：${assessment}；病況變化：${change}`),line('NP1',`R（Recommendation）：已啟動緊急應變，建議立即床邊評估，依病況進一步處置及決定監護／ICU需求；目前：${outcome}`),line('RN2','Team Leader，已完成交班與紀錄，待完成事項會持續追蹤。'),line('NP1','收到。所有人再次確認未完成醫囑、監測與交接責任。')]}
]}
let current=0;const cards=document.getElementById('cards'),role=document.getElementById('role');function safe(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};cases.forEach((c,i)=>{let b=document.createElement('button');b.className='scenario';b.innerHTML=`<strong>${String(i+1).padStart(2,'0')}｜${safe(c[0])}</strong><span class="muted">${safe(c[1])}</span>`;b.onclick=()=>{current=i;history.replaceState(null,'','#case-'+(i+1));render();document.getElementById('viewer').scrollIntoView({behavior:'smooth'})};cards.appendChild(b)});function visibleLines(sc){let r=role.value;return sc.lines.filter(x=>r==='ALL'||x.r===r)}function render(){document.querySelectorAll('.scenario').forEach((b,i)=>b.classList.toggle('active',i===current));let c=cases[current];document.getElementById('caseTitle').textContent=`第${String(current+1).padStart(2,'0')}題｜${c[0]}`;document.getElementById('intro').textContent=c[2];document.getElementById('scenes').innerHTML=script(c).map(sc=>`<div class="scene"><h3>${safe(sc.title)}</h3>${visibleLines(sc).map(x=>`<div class="line"><span class="who">${roleLabels[x.r]}：</span>${safe(x.t)}</div>`).join('')||'<div class="muted">此幕沒有目前角色的台詞。</div>'}</div>`).join('')};function plain(){let c=cases[current];return `住院病人 OSCE｜${c[0]}\n${c[2]}\n\n`+script(c).map(sc=>sc.title+'\n'+visibleLines(sc).map(x=>`${roleLabels[x.r]}：${x.t}`).join('\n')).join('\n\n')+'\n\n教學模擬，實際依院內流程與醫囑。'}role.onchange=render;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(plain());alert('已複製劇本')}catch{alert('無法自動複製，請選取文字手動複製')}};document.getElementById('share').onclick=async()=>{let u=location.href;if(location.protocol==='file:'){alert('目前是本機檔案，請先發布至網站才能分享網址');return}try{if(navigator.share)await navigator.share({title:document.title,url:u});else{await navigator.clipboard.writeText(u);alert('已複製連結')}}catch{}};let m=location.hash.match(/case-(\d+)/);if(m&&+m[1]>=1&&+m[1]<=cases.length)current=+m[1]-1;render();</script></body></html>
